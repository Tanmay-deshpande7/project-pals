name: Security regression checks

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build
      - run: npm ci --ignore-scripts
        working-directory: functions
      - name: Verify backend loads without production credentials
        run: node -e "if (typeof require('./functions').collaborationApi !== 'function') process.exit(1)"
